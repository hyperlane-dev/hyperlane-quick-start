[package]
name = "hyperlane-quick-start"
version = "23.2.0"
readme = "README.md"
edition = "2024"
authors = ["root@devhub.vip"]
license = "MIT"
description = """A lightweight rust http server with middleware, websocket, sse, and tcp support, built on tokio for cross-platform async networking, hyperlane simplifies modern web service development."""
keywords = ["http", "request", "response", "tcp", "cross-platform"]
repository = "https://github.com/hyperlane-dev/hyperlane-quick-start.git"
categories = ["network-programming", "web-programming"]
exclude = [
    "data",
    "*.log",
    "*.pid",
    "target",
    ".github",
    ".vscode",
    "node_modules",
    "Cargo.lock",
]

[workspace]
resolver = "3"
members = ["application", "bootstrap", "config", "plugin", "resources"]

[workspace.dependencies]
hyperlane_config = { path = "config", version = "23.0.45" }
hyperlane_plugin = { path = "plugin", version = "23.0.45" }
hyperlane_bootstrap = { path = "bootstrap", version = "23.0.45" }
hyperlane_resources = { path = "resources", version = "23.0.45" }
hyperlane_application = { path = "application", version = "23.0.45" }

log = "0.4.34"
redis = "1.8.0"
utoipa = "6.0.0"
chrono = "0.4.45"
sea-orm = "2.0.4"
dotenvy = "0.15.7"
tracing = "0.1.44"
num_cpus = "1.17.0"
tempfile = "3.27.0"
hyperlane = "22.0.2"
serde_with = "3.24.0"
serde_yaml = "0.9.33"
color-output = "10.2.11"
lombok-macros = "10.2.11"
file-operation = "10.2.11"
hyperlane-time = "0.7.46"
server-manager = "10.2.11"
instrument-level = "10.2.11"
uuid = { version = "1.29.0", features = ["v4"] }
serde = { version = "1.0.229", features = ["derive"] }

[dependencies]
hyperlane_config = { workspace = true }
hyperlane_plugin = { workspace = true }
hyperlane_bootstrap = { workspace = true }

log = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }
utoipa = { workspace = true }
dotenvy = { workspace = true }
sea-orm = { workspace = true }
tracing = { workspace = true }
num_cpus = { workspace = true }
hyperlane = { workspace = true }
serde_with = { workspace = true }
serde_yaml = { workspace = true }
color-output = { workspace = true }
lombok-macros = { workspace = true }
file-operation = { workspace = true }
hyperlane-time = { workspace = true }
server-manager = { workspace = true }
instrument-level = { workspace = true }

[patch.crates-io]
hyperlane_config = { path = "config" }
hyperlane_plugin = { path = "plugin" }
hyperlane_bootstrap = { path = "bootstrap" }
hyperlane_application = { path = "application" }

[profile.dev]
incremental = true
opt-level = 0
lto = false
panic = "unwind"
debug = false
codegen-units = 16
strip = "none"

[profile.release]
incremental = false
opt-level = 3
lto = "off"
panic = "unwind"
debug = false
codegen-units = 16
strip = "debuginfo"
