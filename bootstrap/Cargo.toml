[package]
name = "hyperlane_bootstrap"
version = "23.0.39"
readme = "README.md"
edition = "2024"
authors = ["root@ltpp.vip"]
license = "MIT"
description = """Hyperlane bootstrap crate providing application initialization and framework lifecycle management."""
keywords = ["http", "request", "response", "tcp", "cross-platform"]
repository = "https://github.com/hyperlane-dev/hyperlane-quick-start.git"
categories = ["network-programming", "web-programming"]
exclude = [
    "data",
    "*.log",
    "*.pid",
    "target",
    ".github",
    ".vscode",
    "node_modules",
    "Cargo.lock",
]

[lib]
path = "lib.rs"

[dependencies]
hyperlane_config = { workspace = true }
hyperlane_plugin = { workspace = true }
hyperlane_application = { workspace = true }

log = { workspace = true }
redis = { workspace = true }
serde = { workspace = true }
sea-orm = { workspace = true }
tracing = { workspace = true }
num_cpus = { workspace = true }
hyperlane = { workspace = true }
lombok-macros = { workspace = true }
